name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-fault-injection:
    # Tier 1 + tier 3: deterministic, no model calls, on every commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit + fault-injection tests
        run: pnpm test
        env:
          # The execution-ledger tests run against the real database schema.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  eval-smoke:
    # Tier 2 smoke subset (tagged smoke): real agent runs on the dev server.
    runs-on: ubuntu-latest
    needs: unit-and-fault-injection
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eve eval smoke reliability --url "http://127.0.0.1:$(pnpm eve-port 2>/dev/null || echo 2000)/" || true
        env:
          # Judge + agent route through the Vercel AI Gateway (pinned in
          # evals/evals.config.ts and agent/agent.ts).
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
